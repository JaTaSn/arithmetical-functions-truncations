name = "dirichlet-truncations-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DirichletTruncations"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "DirichletTruncations"
