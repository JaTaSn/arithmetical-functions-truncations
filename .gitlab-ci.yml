# GitLab Pages for arithmetical-functions-truncations.
#
# This job PUBLISHES ONLY. It assembles a `public/` artifact from files already
# committed and never writes back to the repository -- deliberately, because a
# CI job that commits to the branch it is watching makes CI a second writer
# alongside the author's own machines, and that has bitten this author before
# (2026-08-18: a docs job committing generated files forked history against a
# NAS push relay, and every relay run failed silently for a day).
# Generating artefacts in CI is fine. Committing them back is the part that bites.
#
# The site is static: the Lean documentation under dirichlet-revisited/LEAN/docs/
# is generated locally by doc-gen4 and committed, so nothing is built here.
#
# Changelog (reverse chronological):
#   2026-08-25  initial version.

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    # landing page
    - cp pages/index.html public/index.html
    # the manuscript
    - cp dirichlet-revisited/article/truncations-revisited.pdf public/
    # the Lean documentation, as generated by doc-gen4
    - cp -r dirichlet-revisited/LEAN/docs public/lean
    - rm -f public/lean/README.md
    - echo "published $(find public -type f | wc -l) files"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
